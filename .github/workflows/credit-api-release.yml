name: release
on:
  push:
    branches: ['R_*']
defaults:
  run:
    working-directory: credit-api
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m pytest
  release:
    env:
      IMAGE: creditapi2611.azurecr.io/credit-api:${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: test
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install mlflow-skinny==3.18.0
      - run: python fetch_champion.py
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name creditapi2611
      - run: docker build . --tag $IMAGE
      - run: docker push $IMAGE
      - run: az containerapp update --name credit-api --resource-group rg-credit-api --image $IMAGE
      - name: Check the live app
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors https://credit-api.lemonocean-12436fd6.centralindia.azurecontainerapps.io/health
